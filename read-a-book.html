<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>read a book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="site">
    <header class="masthead">
      <a class="brand" href="index.html">jeslyn</a>
      <nav class="nav">
        <a href="index.html">about</a>
        <a href="things-i-like.html">things i like</a>
        <a href="read-a-book.html" class="active">read a book</a>
      </nav>
    </header>

    <main>
      <div class="prose book-blurb">
        <p>"i haven't read a book on my own since middle school." it's a great day to change that.</p>
        <p class="book-hint">hover over each book to see a quote, and click on it to see my opinions!</p>
      </div>

      <section class="shelf" id="shelf" aria-label="book covers"></section>
    </main>

  </div>

  <div class="lib-overlay" id="overlay" hidden>
    <div class="lib-card" id="libCard" role="dialog" aria-modal="true" aria-label="library card">
      <button class="lib-close" id="libClose" aria-label="close">close</button>
      <div class="lib-head">library card</div>
      <h2 class="lib-title" id="libTitle"></h2>
      <dl class="lib-meta" id="libMeta"></dl>
      <div class="lib-detail">
        <h4>synopsis</h4>
        <p id="libSynopsis"></p>
        <h4>recommended for</h4>
        <p id="libRecommend"></p>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================
       TO ADD A BOOK: copy the block between the ---- lines,
       paste it above the "];" at the bottom of this list, and
       fill in your own values.
         cover -> optional image url; leave "" for a purple cover
         quote -> the line shown when you hover the cover

       ----------------------------------------------------------
      {
        title: "",
        author: "",
        pages: 0,
        words: 0,
        genre: "",
        cover: "",
        quote: "",
        synopsis: "",
        recommend: ""
      },
       ----------------------------------------------------------
       ========================================================= */
    const books = [
      {
        title: "brave new world",
        author: "aldous huxley",
        pages: 311,
        words: 64531,
        genre: "dystopian fiction",
        cover: "",
        quote: "i don't want comfort. i want poetry, i want real danger, i want freedom.",
        synopsis: "a world engineered for stability through conditioning, consumption, and a drug called soma — until a few people start to feel the cost of frictionless happiness.",
        recommend: "anyone who's ever wondered whether comfort and freedom can actually coexist."
      },
      {
        title: "lolita",
        author: "vladimir nabokov",
        pages: 336,
        words: 112473,
        genre: "literary fiction",
        cover: "",
        quote: "lolita, light of my life, fire of my loins.",
        synopsis: "an unreliable narrator's confession that dazzles with language while describing something monstrous — a novel about obsession, self-deception, and the seductiveness of prose.",
        recommend: "readers who want to argue with a narrator on every single page."
      },
      {
        title: "crime and punishment",
        author: "fyodor dostoevsky",
        pages: 671,
        words: 211591,
        genre: "psychological fiction",
        cover: "",
        quote: "to go wrong in one's own way is better than to go right in someone else's.",
        synopsis: "a destitute ex-student talks himself into a murder, then spends the rest of the book unraveling under the weight of his own conscience.",
        recommend: "anyone drawn to guilt, redemption, and long feverish walks through the city."
      }
    ];

    const shelf = document.getElementById("shelf");
    const overlay = document.getElementById("overlay");

    books.forEach((book) => {
      const cover = document.createElement("button");
      cover.className = "cover";
      cover.type = "button";
      cover.setAttribute("aria-label", book.title);

      const inner = document.createElement("div");
      inner.className = "cover-inner";

      const front = document.createElement("div");
      front.className = "cover-face cover-front";
      if (book.cover) {
        front.classList.add("cover-front--image");
        front.style.backgroundImage = "url('" + book.cover + "')";
      } else {
        front.innerHTML = '<span class="cover-title">' + book.title + "</span>";
      }

      const back = document.createElement("div");
      back.className = "cover-face cover-back";
      back.innerHTML = '<p class="cover-quote">' + (book.quote ? "\u201c" + book.quote + "\u201d" : book.title) + "</p>";

      inner.appendChild(front);
      inner.appendChild(back);
      cover.appendChild(inner);
      cover.addEventListener("click", () => openCard(book));
      shelf.appendChild(cover);
    });

    function openCard(book) {
      document.getElementById("libTitle").textContent = book.title;
      document.getElementById("libMeta").innerHTML =
        row("author", book.author) +
        row("page count", book.pages.toLocaleString()) +
        row("word count", book.words.toLocaleString()) +
        row("genre", book.genre);
      document.getElementById("libSynopsis").textContent = book.synopsis;
      document.getElementById("libRecommend").textContent = book.recommend;
      overlay.hidden = false;
    }

    function row(label, value) {
      return '<div class="lib-row"><dt>' + label + "</dt><dd>" + value + "</dd></div>";
    }

    function closeCard() {
      overlay.hidden = true;
    }

    document.getElementById("libClose").addEventListener("click", closeCard);
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) closeCard();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeCard();
    });
  </script>
</body>
</html>
